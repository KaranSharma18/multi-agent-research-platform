[project]
name = "mara-mcp-knowledge"
version = "0.1.0"
description = "MCP server: hybrid (dense + BM25) document search over Qdrant with ACL filtering."
requires-python = ">=3.12"
dependencies = [
    "mara-core",
    "mcp>=1.30,<2",
    "qdrant-client>=1.15",
    "google-genai>=1.40",
]

[project.scripts]
mara-mcp-knowledge = "mara_mcp_knowledge.__main__:main"

[tool.uv.sources]
mara-core = { workspace = true }

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mara_mcp_knowledge"]
