[project]
name = "mara-mcp-live-data"
version = "0.1.0"
description = "MCP server: live operational data (incidents, service status, GitHub issues and PRs, FX rates)."
requires-python = ">=3.12"
dependencies = [
    "mara-core",
    "mcp>=1.30,<2",
    "httpx>=0.28",
]

[project.scripts]
mara-mcp-live-data = "mara_mcp_live_data.__main__:main"

[tool.uv.sources]
mara-core = { workspace = true }

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mara_mcp_live_data"]
