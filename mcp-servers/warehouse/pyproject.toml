[project]
name = "mara-mcp-warehouse"
version = "0.1.0"
description = "MCP server: read-only SQL over the analytics warehouse, guarded by a SQL parser, a read-only role and row-level security."
requires-python = ">=3.12"
dependencies = [
    "mara-core",
    "mcp>=1.30,<2",
    "sqlglot>=27",
    "psycopg[binary,pool]>=3.2",
]

[project.scripts]
mara-mcp-warehouse = "mara_mcp_warehouse.__main__:main"

[tool.uv.sources]
mara-core = { workspace = true }

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mara_mcp_warehouse"]
