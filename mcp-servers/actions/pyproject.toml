[project]
name = "mara-mcp-actions"
version = "0.1.0"
description = "MCP server: the only place writes happen. Requires the executor's token, the tool's write scope and a one-time approval token bound to the exact arguments."
requires-python = ">=3.12"
dependencies = [
    "mara-core",
    "mcp>=1.30,<2",
    "httpx>=0.28",
]

[project.scripts]
mara-mcp-actions = "mara_mcp_actions.__main__:main"

[tool.uv.sources]
mara-core = { workspace = true }

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mara_mcp_actions"]
