[project]
name = "mara-mock-apis"
version = "0.1.0"
description = "Stand-ins for the third-party APIs the agents use (incident API, status page, GitHub, Slack, FX rates), served from seeded fixtures."
requires-python = ">=3.12"
dependencies = [
    "mara-core",
    "fastapi>=0.115",
]

[project.scripts]
mara-mock-apis = "mara_mock_apis.__main__:main"

[tool.uv.sources]
mara-core = { workspace = true }

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mara_mock_apis"]
