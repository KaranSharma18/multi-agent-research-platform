[project]
name = "mara-token-service"
version = "0.1.0"
description = "A small OAuth 2.0 token service for local development: client credentials, token exchange (RFC 8693) and a dev-only password grant. Keycloak replaces it in production."
requires-python = ">=3.12"
dependencies = [
    "mara-core",
    "fastapi>=0.115",
    "python-multipart>=0.0.20",
]

[project.scripts]
mara-token-service = "mara_token_service.__main__:main"

[tool.uv.sources]
mara-core = { workspace = true }

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mara_token_service"]
