[project]
name = "mara-data"
version = "0.1.0"
description = "Deterministic synthetic world (customers, incidents, documents) plus the ingestion pipeline into Qdrant."
requires-python = ">=3.12"
dependencies = [
    "mara-core",
    "mara-mcp-knowledge",
    "qdrant-client>=1.15",
    "psycopg[binary,pool]>=3.2",
]

[tool.uv.sources]
mara-core = { workspace = true }
mara-mcp-knowledge = { workspace = true }

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mara_data"]
