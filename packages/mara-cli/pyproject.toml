[project]
name = "mara-cli"
version = "0.1.0"
description = "The `mara` developer command line: keys, seed, ingest, run services, ask, eval, replay."
requires-python = ">=3.12"
dependencies = [
    "mara-core",
    "mara-data",
    "mara-evals",
    "mara-orchestrator",
    "typer>=0.15",
    "rich>=13",
]

[project.scripts]
mara = "mara_cli.main:app"

[tool.uv.sources]
mara-core = { workspace = true }
mara-data = { workspace = true }
mara-evals = { workspace = true }
mara-orchestrator = { workspace = true }

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mara_cli"]
