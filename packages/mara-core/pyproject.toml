[project]
name = "mara-core"
version = "0.1.0"
description = "Shared building blocks for every MARA service: settings, auth, PII and injection guards, retrieval encoders, database helpers."
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.11",
    "pydantic-settings>=2.10",
    "pyyaml>=6.0",
    "structlog>=25.0",
    "httpx>=0.28",
    "httpx-sse>=0.4",
    "python-dotenv>=1.0",
    "pyjwt[crypto]>=2.10",
    "cryptography>=44",
    "psycopg[binary,pool]>=3.2",
    "prometheus-client>=0.22",
    "uvicorn>=0.35",
    "starlette>=0.47",
    "mcp>=1.30,<2",
    "google-genai>=1.40",
    "opentelemetry-sdk>=1.36",
    "opentelemetry-exporter-otlp-proto-http>=1.36",
    "opentelemetry-instrumentation-httpx>=0.57b0",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mara_core"]
