[project]
name = "mara-research-agent"
version = "0.1.0"
description = "A remote web-research agent built on the Claude Agent SDK, served over A2A v1.0. A Gemini engine and a scripted stub engine share the same interface."
requires-python = ">=3.12"
dependencies = [
    "mara-core",
    "a2a-sdk[http-server,signing]>=1.3,<2",
    "claude-agent-sdk>=0.2.180,<0.3",
    "google-genai>=1.40",
    "starlette>=0.47",
]

[project.scripts]
mara-research-agent = "mara_research_agent.__main__:main"

[tool.uv.sources]
mara-core = { workspace = true }

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mara_research_agent"]
